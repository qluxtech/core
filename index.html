<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Gateway - BSV Micro-Payment Infrastructure</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #58a6ff;
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #8b949e;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            font-family: monospace;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        .status-active {
            color: #3fb950;
            font-weight: bold;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #2ea043;
        }
        pre {
            background-color: #010409;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 0.85rem;
            color: #79c0ff;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QUANTUM GATEWAY</h1>
        <div class="subtitle">qlux.tech &mdash; Distributed Micro-Payment Infrastructure</div>
        
        <div class="card">
            <p><strong>System Core:</strong> Nginx + FastAPI</p>
            <p><strong>Network:</strong> BSV Micro-Stream</p>
            <p><strong>Status:</strong> <span class="status-active">ACTIVE & DEPLOYED</span></p>
        </div>

        <button id="test-btn" onclick="testApi()">Test API Endpoint</button>
        <pre id="api-result"></pre>
    </div>

    <script>
        async function testApi() {
            const resultElement = document.getElementById('api-result');
            resultElement.style.display = 'block';
            resultElement.textContent = 'Connecting to EC2 FastAPI backend...';

            // 直接EC2のパブリックIPまたはAPI Gatewayのエンドポイントを指定
            const apiUrl = 'http://18.178.125.229/api/v1/stream';

            try {
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'BSV-Micropayment test-token-12345'
                    }
                });
                
                const data = await response.json();
                resultElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                resultElement.textContent = 'Error: ' + error.message + '\n\n(Note: If the browser blocks HTTP from HTTPS, please ensure CORS or direct IP access is allowed.)';
            }
        }
    </script>
</body>
</html>
