<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-LUX ENTERPRISE | Autonomous Teranode Infrastructure</title>
    <style>
        :root {
            --bg-primary: #030712;
            --bg-card: #0b0f19;
            --border-color: rgba(31, 41, 55, 0.8);
            --border-glow: rgba(16, 185, 129, 0.25);
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }
        .brand-logo {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-green);
            text-transform: uppercase;
        }
        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Canvasコンテナ（丁度良い拡大調整） */
        #canvas-container {
            position: relative;
            width: 100%;
            height: 180px;
            margin-bottom: 20px;
            background: #030712;
            border-radius: 8px;
            border: 2px solid #2f855a;
            box-shadow: 0 0 15px rgba(47, 133, 90, 0.3);
            overflow: hidden;
            transform: scale(1.03);
            transform-origin: center center;
        }
        #quantum-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .data-card, .module-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 15px;
        }

        .logs-box {
            background: #010409;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            height: 100px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-logo">Q-LUX ENTERPRISE</div>
            <div class="brand-subtitle">Autonomous Teranode & Live HandCash Gateway</div>
        </header>

        <!-- Canvas アニメーションモニター -->
        <div id="canvas-container">
            <canvas id="quantum-canvas"></canvas>
        </div>

        <div class="data-card">
            <div id="auditBox" class="logs-box">[05:12:20] ストリーム接続確立: vlisdigitalassetlabs@handcash.io 監視中...</div>
        </div>
    </div>

    <script>
        const WS_URL = 'ws://18.178.125.229:8000';
        const API_BASE_URL = 'http://18.178.125.229:8000';

        const auditBox = document.getElementById('auditBox');
        let currentRevenue = 48255528;
        let activeNodes = 524100;
        let compoundPool = 1251385;
        let isCompoundActive = true;
        const targetPaymail = 'vlisdigitalassetlabs@handcash.io';

        function logMessage(msg) {
            const timeStr = new Date().toLocaleTimeString();
            auditBox.innerHTML = '[' + timeStr + '] ' + msg + '<br>' + auditBox.innerHTML;
        }

        function connectWebSocket() {
            const ws = new WebSocket(WS_URL);
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'LIVE_UPDATE' || data.type === 'INIT_STATE') {
                    currentRevenue = data.revenue;
                }
            };
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }
        connectWebSocket();

        // Canvasアニメーション設定
        const canvas = document.getElementById('quantum-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            canvas.width = container.clientWidth * 2;
            canvas.height = container.clientHeight * 2;
            ctx.scale(2, 2);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let particles = [];
        const numParticles = 120;

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * (canvas.width / 2);
                this.y = Math.random() * (canvas.height / 2);
                this.size = Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.speedY = (Math.random() * 0.5 + 0.1) * 1.2;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.y > (canvas.height / 2) || this.x < 0 || this.x > (canvas.width / 2)) {
                    this.reset();
                    this.y = -10;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(47, 133, 90, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function draw() {
            ctx.fillStyle = 'rgba(3, 7, 18, 0.4)';
            ctx.fillRect(0, 0, canvas.width / 2, canvas.height / 2);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
